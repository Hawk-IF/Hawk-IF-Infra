name: ${PROJECT_PREFIX:-HawkIF}

networks:
  Backend-Net:
    name: ${BACKEND_NETWORK}
    external: true

volumes:
  Redis-Data:
    name: ${REDIS_VOLUME}
    external: true
  

services:
  redis:
    image: redis:8.10-alpine3.23

    restart: on-failure:3

    environment:
      - REDIS_PASSWORD: ${REDIS_PASSWORD:-admin}

    command:
      - sh
      - -ec
      - >-
        exec redis-server
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --requirepass "$$REDIS_PASSWORD"

    volumes:
      - Redis-Data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWO\" ping | grep -qx PONG"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    expose:
      - "6379"
    
    networks:
      - Backend-Net
    
