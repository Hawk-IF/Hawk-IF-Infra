services:
  nginx:
    image: nginx:1.31-alpine3.24

    restart: unless-stopped

    ports:
      - "${NGINX_PORT:-8080}:80"

    configs:
      - source: nginx_default_conf
        target: /etc/nginx/conf.d/default.conf

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:80/healthz | grep -qx ok"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - Hawk-IF-Backend-Gateway-Net